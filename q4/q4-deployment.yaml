apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: spam-api

  template:
    metadata:
      labels:
        app: spam-api

    spec:
      containers:
        - name: spam-api
          image: spam-api:k8s-v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: spam-api
spec:
  selector:
    app: spam-api

  ports:
    - port: 8080
      targetPort: 8080

  type: ClusterIP
